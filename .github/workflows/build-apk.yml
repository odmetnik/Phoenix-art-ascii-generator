name: Build Phoenix ASCII Studio APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Phoenix-ASCII-Studio-v1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-ASCII-Studio-APK
          path: Phoenix-ASCII-Studio-v1.0-debug.apk
          if-no-files-found: error
